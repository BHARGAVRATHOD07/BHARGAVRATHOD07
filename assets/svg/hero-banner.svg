<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d14"/><stop offset="1" stop-color="#1a1426"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9f43"/><stop offset="1" stop-color="#a29bfe"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ff9f43" stop-opacity=".35"/><stop offset="1" stop-color="#ff9f43" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2"><stop offset="0" stop-color="#6c5ce7" stop-opacity=".4"/><stop offset="1" stop-color="#6c5ce7" stop-opacity="0"/></radialGradient>
    <clipPath id="type"><rect x="60" y="150" width="0" height="40">
      <animate attributeName="width" values="0;640;640;0" keyTimes="0;0.5;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>
  <rect width="900" height="260" rx="16" fill="url(#bg)"/>
  <circle r="160" fill="url(#glow)"><animate attributeName="cx" values="150;350;150" dur="9s" repeatCount="indefinite"/><animate attributeName="cy" values="60;200;60" dur="9s" repeatCount="indefinite"/></circle>
  <circle r="200" fill="url(#glow2)"><animate attributeName="cx" values="760;560;760" dur="11s" repeatCount="indefinite"/><animate attributeName="cy" values="200;40;200" dur="11s" repeatCount="indefinite"/></circle>
  <g fill="#fff" opacity=".6">
    <circle cx="80" cy="40" r="1.5"><animate attributeName="opacity" values=".1;1;.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="30" r="1.2"><animate attributeName="opacity" values="1;.1;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="50" r="1.5"><animate attributeName="opacity" values=".1;1;.1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="90" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="230" r="1.5"><animate attributeName="opacity" values=".1;1;.1" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>
  <text x="60" y="105" font-family="'JetBrains Mono','Courier New',monospace" font-size="14" fill="#6c5ce7">&lt;hello world /&gt;</text>
  <text x="60" y="140" font-family="'Segoe UI',Arial,sans-serif" font-size="44" font-weight="700" fill="url(#txt)">Bhargav Rathod
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>
  <g clip-path="url(#type)">
    <text x="60" y="180" font-family="'JetBrains Mono','Courier New',monospace" font-size="20" fill="#e6e6f0">Software Developer · DSA · Backend &amp; Web</text>
  </g>
  <rect x="60" y="164" width="10" height="22" fill="#ff9f43">
    <animate attributeName="x" values="60;700;700;60" keyTimes="0;0.5;0.9;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="60" y="226" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" fill="#8a8aa0">B.Tech CSE @ CHARUSAT · Gujarat, India · open to SDE internships</text>
</svg>
