<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 20" width="900" height="20">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9f43" stop-opacity="0"/><stop offset=".5" stop-color="#a29bfe"/><stop offset="1" stop-color="#ff9f43" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="9" width="900" height="2" fill="url(#l)" opacity=".5"/>
  <circle cy="10" r="4" fill="#ff9f43">
    <animate attributeName="cx" values="0;900" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cy="10" r="9" fill="#ff9f43" opacity=".2">
    <animate attributeName="cx" values="0;900" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
